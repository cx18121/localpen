name: Localpen
options:
  bundleIdPrefix: app.localpen
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0
  TOMLKit:
    url: https://github.com/LebJe/TOMLKit
    from: 0.6.0

targets:
  Localpen:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Localpen
        excludes:
          - "Info.plist"
          - "Resources/llama-server"
      - path: Localpen/Resources/llama-server
        buildPhase: resources
        type: file
    info:
      path: Localpen/Info.plist
      properties:
        LSUIElement: true
        NSQuitAlwaysKeepsWindows: false
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright © 2026 Localpen."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.localpen.Localpen
        PRODUCT_NAME: Localpen
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: "2L525PQAPB"
        CODE_SIGN_IDENTITY: B34F936CCB151247A80B25244A2BF6E35AFC66DC
        "CODE_SIGN_IDENTITY[sdk=macosx*]": B34F936CCB151247A80B25244A2BF6E35AFC66DC
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: targeted
    dependencies:
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: GRDB
        product: GRDB
      - package: TOMLKit
        product: TOMLKit
    postBuildScripts:
      # Keep /Applications/Localpen.app current after every Debug build so the
      # menu-bar app launches from Spotlight/Raycast and reflects the latest
      # code. Debug-gated so an archive/Release build never clobbers it. Relies
      # on ENABLE_USER_SCRIPT_SANDBOXING: NO to write outside the build dir.
      - name: "Install Debug build to /Applications"
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            # ditto (not cp -R) preserves the code signature + embedded-framework
            # symlinks. Stage into a sibling path first, then swap: if a prior
            # instance is still running FROM /Applications (we launch it there for
            # Raycast), copying directly over the live bundle corrupts the
            # signature and launchd refuses to spawn it. Staging keeps the signed
            # bytes away from the running process, then a rename swaps cleanly.
            DEST="/Applications/$PRODUCT_NAME.app"
            STAGE="/Applications/.$PRODUCT_NAME.staging.app"
            rm -rf "$STAGE"
            ditto "$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app" "$STAGE"
            rm -rf "$DEST"
            mv "$STAGE" "$DEST"
          fi
