name: Localpen
options:
  bundleIdPrefix: app.localpen
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0
  TOMLKit:
    url: https://github.com/LebJe/TOMLKit
    from: 0.6.0
  DynamicNotchKit:
    url: https://github.com/MrKai77/DynamicNotchKit
    from: 1.1.0

targets:
  Localpen:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Localpen
        excludes:
          - "Info.plist"
          - "Resources/llama-server"
      - path: Localpen/Resources/llama-server
        buildPhase: resources
        type: file
    info:
      path: Localpen/Info.plist
      properties:
        LSUIElement: true
        NSQuitAlwaysKeepsWindows: false
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright © 2026 Localpen."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.localpen.Localpen
        PRODUCT_NAME: Localpen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        ENABLE_HARDENED_RUNTIME: YES
        # Disable the Xcode 16 debug-dylib split so the app builds as a
        # single binary; required for BUNDLE_LOADER to work in the test target.
        ENABLE_DEBUG_DYLIB: NO
        CODE_SIGN_STYLE: Manual
        # Ad-hoc signing works without a developer account. Override locally for TCC stability.
        CODE_SIGN_IDENTITY: "-"
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: targeted
    dependencies:
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: GRDB
        product: GRDB
      - package: TOMLKit
        product: TOMLKit
      - package: DynamicNotchKit
        product: DynamicNotchKit

  # `localpen` agent-retrieval CLI (PLAN-brain.md Phase 5). A standalone command-line
  # tool that compiles the brain READ core directly — no duplicated query logic, and it
  # opens the same `~/Library/Application Support/Localpen/brain.sqlite` the app writes.
  # Only the Foundation/GRDB-only files are listed (no SwiftUI/AppKit, no watcher/engine).
  localpen-cli:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LocalpenCLI
      - path: Localpen/Services/Brain/KBModels.swift
      - path: Localpen/Services/Brain/MarkdownParser.swift
      - path: Localpen/Services/Brain/BrainIndex.swift
      - path: Localpen/Services/Brain/KBSearch.swift
      - path: Localpen/Services/Brain/MCPServer.swift
      - path: Localpen/Services/Brain/ProjectMatcher.swift
      # Hybrid-retrieval units BrainIndex/KBSearch now reference — the CLI compiles
      # those files, so it needs these to keep building (feat/hybrid-rag).
      - path: Localpen/Services/Brain/VectorMath.swift
      - path: Localpen/Services/Brain/RankFusion.swift
      - path: Localpen/Services/Brain/EmbeddingService.swift
      - path: Localpen/Services/Brain/EmbeddingStore.swift
      - path: Localpen/Services/BrainAccess.swift
      - path: Localpen/Services/AppSupport.swift
      - path: Localpen/Services/Memory/VoiceDataExporter.swift
    settings:
      base:
        PRODUCT_NAME: localpen
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: targeted
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
    dependencies:
      - package: GRDB
        product: GRDB

  LocalpenTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LocalpenTests
    dependencies:
      - target: Localpen
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.localpen.LocalpenTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        # Hosted bundle: TEST_HOST injects the test bundle into the Localpen
        # process so @testable import resolves. AppDelegate guards on
        # XCTestConfigurationFilePath so llama-server never starts during tests.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Localpen.app/Contents/MacOS/Localpen"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
        # Ad-hoc signing works without a developer account. Override locally for TCC stability.
        CODE_SIGN_IDENTITY: "-"
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"

schemes:
  Localpen:
    build:
      targets:
        Localpen: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LocalpenTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  localpen-cli:
    build:
      targets:
        localpen-cli: all
    run:
      config: Release
    archive:
      config: Release
