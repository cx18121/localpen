# Localpen model registry per SWIFTUI-SPEC.md §12.2 / ADR 0005.
# Loaded by Services/ModelRegistry.swift at app boot.
# Uses inline tables for `prompts` and `sampling` because TOMLKit's Codable
# path mishandles array-of-tables sub-headers (`[models.prompts]` after
# `[[models]]`) — the failure manifests as a misleading "Expected a table,
# but found a string" error on download_url.

[[models]]
id = "qwen-2.5-7b-instruct-q4-km"
name = "Qwen 2.5 7B Instruct"
download_url = "https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf"
download_size_bytes = 4683074240
sha256 = ""
context_size = 4096
chat_template = "chatml"
default = true
prompts = { proofread = "Fix only grammar, spelling, and punctuation in the user's text. Preserve voice and length exactly. Output only the corrected text.", polish = "Polish the user's text: fix grammar, smooth awkward phrasing, minor rephrasing only. Preserve meaning, tone, and approximate length. Output only the polished text.", more_formal = "Rewrite the user's text in a more formal, professional tone. Preserve meaning. Length may shift slightly. Output only the rewritten text.", more_casual = "Rewrite the user's text in a more casual, friendly tone. Preserve meaning. Length may shift slightly. Output only the rewritten text.", shorter = "Shorten the user's text. Preserve meaning. Cut words. Output only the shortened text." }
sampling = { temperature = 0.4, top_p = 0.9, repeat_penalty = 1.05 }
